# =====================================================================
# application.properties
# Configuración principal del backend de Platform.
# Spring Boot lee este archivo al arrancar y con él decide cómo
# conectarse a la base de datos y cómo comportarse, sin tocar código.
# Formato: clave=valor. Las líneas con # son comentarios.
# =====================================================================

# Nombre de la aplicación (aparece en los logs como [backend])
spring.application.name=backend

# ---------------------------------------------------------------------
# Base de datos H2 en memoria (solo para desarrollo)
# Los datos se borran cada vez que se detiene la aplicación.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:platform
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para ver tablas y ejecutar SQL.
# Abrir en: http://localhost:8080/h2-console  (NUNCA activar en producción)
spring.h2.console.enabled=true

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# Muestra en la consola el SQL que se ejecuta (útil para aprender y depurar)
spring.jpa.show-sql=true
# Cierra la conexión a la BD al salir del servicio; el controlador no consulta la BD
spring.jpa.open-in-view=false
